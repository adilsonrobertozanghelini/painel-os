 conceito:{nome:'Conceito',fantasia:'Conceito',razao:'',cnpj:'',end:'',tel:'',logo:'',ativa:true},
 suprema:{nome:'Suprema',fantasia:'Comercial Suprema',razao:'Comercial Suprema LTDA',cnpj:'59.718.539/0001-23',end:'Rua Dom Luiz, 307 · Vila Real · Balneário Camboriú/SC · CEP 88337-100',tel:'(47) 99653-0558',logo:'logos/suprema.jpg',ativa:true}

let myEmp=[],emp=null,isAdmin=false,meEmail='';

try{const t=sessionStorage.getItem('os-tab');if(t&&(SK[t]||t==='mensal'))tab=t}catch(e){}

const $=s=>document.querySelector(s);

const fdm=d=>String(d||'').split('-').reverse().join('/').slice(0,5);
const payText=o=>o.pagTipo==='parcelas'&&(o.parcelas||[]).length?o.parcelas.map(p=>(p.l?p.l+' ':'')+money(p.v)+(p.dt?' em '+fdm(p.dt):'')).join(' + '):o.pagTipo==='data'&&o.vencData?'vencimento em '+o.vencData.split('-').reverse().join('/'):(o.prazo?o.prazo+' dias após a emissão da nota':'');
const nOS=o=>o.numero?String(o.numero).padStart(4,'0'):'';

function parseBR(s){s=String(s||'').trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0}
const total=o=>(o.itens||[]).reduce((s,i)=>s+(+i.qtd||0)*(+i.valor||0),0);
const fdt=ts=>ts?new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
const emsg=e=>e&&e.code==='permission-denied'?'Sem permissão para essa ação.':'Não foi possível salvar. Verifique a internet e tente de novo.';

async function boot(){
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  window._auth=auth;
  onAuthStateChanged(auth,async u=>{
    if(unsub){unsub();unsub=null}if(unsub2){unsub2();unsub2=null}if(unsub3){unsub3();unsub3=null}condos=[];ordersReady=false;mensaisReady=false;
    if(!u){meId=null;meName='';orders=[];mensais=[];emp=null;myEmp=[];err='';loading=false;try{sessionStorage.removeItem('os-emp')}catch(e){}renderLogin();return}
    meId=u.uid;meEmail=(u.email||'').toLowerCase();isAdmin=meEmail===ADMIN;
    const base=u.displayName||(u.email||'').split('@')[0];
    meName=base.charAt(0).toUpperCase()+base.slice(1);
    loading=true;err='';emp=null;render();
    try{
      if(isAdmin)myEmp=Object.keys(EMPRESAS).filter(k=>EMPRESAS[k].ativa);
      else{const sn=await getDoc(doc(fs,'usuarios',meEmail));myEmp=sn.exists()?(sn.data().empresas||[]).filter(k=>EMPRESAS[k]):[]}
    }catch(e){myEmp=[]}
    if(!myEmp.length){err='noaccess';loading=false;render();return}
    if(isAdmin)await backfill();
    let st=null;try{st=sessionStorage.getItem('os-emp')}catch(e){}
    emp=myEmp.includes(st)?st:(myEmp.length===1?myEmp[0]:null);
    if(!emp){loading=false;renderChooser();return}
    listen();
  });
}
function pickEmp(k){emp=k;try{sessionStorage.setItem('os-emp',k)}catch(e){}openId=null;listen()}
function listen(){
  if(unsub){unsub();unsub=null}if(unsub2){unsub2();unsub2=null}if(unsub3){unsub3();unsub3=null}
  condos=[];ordersReady=false;mensaisReady=false;orders=[];mensais=[];loading=true;err='';render();
  unsub=onSnapshot(query(collection(fs,'os'),where('empresa','==',emp)),snap=>{
    orders=snap.docs.map(d=>({...d.data(),id:d.id}));ordersReady=true;loading=false;err='';render();gen();
  },e=>{err=e.code||'x';loading=false;render()});

    mensais=snap.docs.map(d=>({...d.data(),id:d.id}));mensaisReady=true;render();gen();
  },e=>{mensaisReady=true});

// Migração única (só administrador): marca empresa nos dados antigos e numera as 3 OS já emitidas da Omega.
async function backfill2(){
  try{if(localStorage.getItem('os-bf2'))return}catch(e){}
  try{
    for(const c of ['os','mensal']){
      const sn=await getDocs(query(collection(fs,c),where('empresa','==','conceito')));
      for(const d of sn.docs)await updateDoc(d.ref,{empresa:'omega'});
    }
    try{localStorage.setItem('os-bf2','1')}catch(e){}
  }catch(e){}
}
async function backfill(){
  await backfill2();
  try{if(localStorage.getItem('os-bf1'))return}catch(e){}
  try{
    const so=await getDocs(collection(fs,'os')),sm=await getDocs(collection(fs,'mensal'));
    const mEmp={};
    for(const d of sm.docs){let e=d.data().empresa;if(!e){e='omega';await updateDoc(d.ref,{empresa:e})}mEmp[d.id]=e}
    const first=[['vale dos reis',1],['torre molinos',2],['vitrina',3]];const used=new Set(so.docs.map(d=>d.data().numero).filter(Boolean));
    let maxN=0;
    for(const d of so.docs){
      const o=d.data();if(o.empresa)continue;
      const nm=(o.cliente||'').toLowerCase();
      const hit=!o.mensalId&&(o.stage==='executado'||o.stage==='pago')?first.find(x=>nm.includes(x[0])&&!used.has(x[1])):null;
      if(hit){used.add(hit[1]);maxN=Math.max(maxN,hit[1]);await updateDoc(d.ref,{empresa:'omega',numero:hit[1]})}
      else await updateDoc(d.ref,{empresa:o.mensalId?(mEmp[o.mensalId]||'omega'):'conceito'});
    }
    if(maxN){const cr=doc(fs,'contadores','omega');const cs=await getDoc(cr);const cur=cs.exists()?cs.data().n||0:0;if(cur<maxN)await setDoc(cr,{n:maxN})}
    try{localStorage.setItem('os-bf1','1')}catch(e){}
  }catch(e){}
}

    h('button',{class:'btn primary',text:'Entrar',onclick:go})));

function stageOrders(k){return orders.filter(o=>(o.stage||'aberto')===k)}
function render(){
  const app=$('#app');app.textContent='';
  const st=SK[tab]||SK.aberto;
  app.append(h('header',null,
    h('img',{src:'logos/greenblue.png',alt:'Green Blue',style:'width:44px;height:44px;border-radius:10px;flex:none'}),h('div',{style:'flex:1;min-width:0'},h('h1',{text:'Painel de OS'}),h('div',{class:'sub',text:(emp&&EMPRESAS[emp]?EMPRESAS[emp].nome+' · ':'')+'Condomínios · da OS ao pagamento'})),
    h('div',{class:'acts'},myEmp.length>1?empSelect():null,h('button',{class:'btn small',text:'Condomínios',onclick:openCondos}),isAdmin?h('button',{class:'btn small',text:'Acessos',onclick:openAcessos}):null,h('button',{class:'btn small',text:'Sair',title:meName,onclick:()=>signOut(window._auth)}),tab!=='mensal'?h('button',{class:'btn primary',id:'new',onclick:()=>openForm(null),text:'Nova OS'}):h('button',{class:'btn primary',onclick:()=>openMensal(null),text:'Nova mensalidade'}))));

const STARTERS=['CENTRAL','BATERIA','SENSOR','SIRENE','CABO','FONTE','CAMERA','CÂMERA','MAO','MÃO','TECLADO','CONTROLE','FECHADURA','INTERFONE','PORTEIRO','CERCA','MODULO','MÓDULO','DVR','NVR','HD','SWITCH','ROTEADOR','NOBREAK','DISCADORA','ANTENA','CONECTOR','FIO','TUBO','ELETROCALHA','MOTOR','PLACA','RECEPTOR','TRANSMISSOR','LAMPADA','LÂMPADA','REFLETOR','DETECTOR','KIT','INSTALACAO','INSTALAÇÃO','SERVICO','SERVIÇO','TRAVA','CANCELA','BOTOEIRA','ACIONADOR','CONTROLADOR','LEITOR','TAG','COTOVELO','CAIXA','ELETRODUTO','PARAFUSO','BUCHA','ABRAÇADEIRA','FITA','EMENDA','DIVISOR','AMPLIFICADOR','MONITOR','VIDEO','VÍDEO','GRAVADOR','LENTE','SUPORTE','POSTE','MASTRO','FONTES','CAMERAS','CÂMERAS'];
function num(s){s=String(s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:NaN}
function splitDesc(txt,n,extra){
  txt=txt.replace(/\s+/g,' ').trim();
  if(n<=1)return [txt];
  const st=new Set(STARTERS.concat(extra||[]).map(x=>x.toUpperCase()));
  const toks=txt.split(' ');const cuts=[];
  for(let i=1;i<toks.length;i++){if(st.has(toks[i].toUpperCase().replace(/[^A-ZÀ-Ú0-9]/g,'')))cuts.push(i)}
  let use=cuts;
  if(cuts.length>n-1)use=cuts.slice(0,n-1); // sobra: ajusta na revisão
  const parts=[];let a=0;for(const c of use){parts.push(toks.slice(a,c).join(' '));a=c}
  parts.push(toks.slice(a).join(' '));
  while(parts.length<n)parts.push('');
  return parts.map(p=>p.replace(/\s*-\s*$/,'').trim());
}
function parseItems(text,extra){
  const t=String(text||'').replace(/\r/g,'').trim();
  if(!t)return {items:[],warn:''};
  const m=t.replace(/\n/g,' ').match(/Qtd\.?:?\s*([\d.,\s]+?)\s*Val\.?\s*Unit\.?:?\s*([\d.,\s]+?)\s*(?:Valor|Total)\.?:?\s*([\d.,\s]+)$/i);
  if(m){
    const q=m[1].trim().split(/\s+/),u=m[2].trim().split(/\s+/);
    const n=Math.min(q.length,u.length);
    let d=t.replace(/\n/g,' ');
    d=d.slice(0,d.search(/Qtd\.?:?/i)).replace(/^\s*Descri[cç][aã]o:?\s*/i,'').replace(/\s*Total:?\s*$/i,'').trim();
    let descs;
    const lines=t.slice(0,t.search(/Qtd\.?:?/i)).split('\n').map(x=>x.replace(/^\s*Descri[cç][aã]o:?\s*/i,'').replace(/\s*Total:?\s*$/i,'').trim()).filter(Boolean);
    descs=lines.length===n?lines:splitDesc(d,n,extra);
    const items=[];for(let i=0;i<n;i++)items.push({desc:descs[i]||'',qtd:num(q[i])||1,valor:num(u[i])||0});
    return {items,warn:lines.length===n?'':'Separei os nomes pelo texto colado; confira se cada item ficou com o nome certo.'};
  }
  const items=[];
  for(const ln of t.split('\n')){
    const r=ln.trim().match(/^(.*?)[\s\t]+(\d+(?:[.,]\d+)?)[\s\t]+(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})(?:[\s\t]+(?:R\$\s*)?\d{1,3}(?:\.\d{3})*,\d{2})?$/);
    if(r&&r[1])items.push({desc:r[1].trim(),qtd:num(r[2])||1,valor:num(r[3])||0});
  }
  return {items,warn:items.length?'':'Não reconheci os itens. Cole com quantidades e valores unitários.'};
}

function micBtn(cli,desc,known){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  const st=h('span',{class:'meta',text:'Fale: nome do condomínio, depois o serviço.'});
  const b=h('button',{class:'btn',type:'button',text:'Falar a OS'});
  let rec=null,on=false;
  b.onclick=()=>{
    if(on){rec&&rec.stop();return}
    rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.continuous=false;
    rec.onstart=()=>{on=true;b.textContent='Parar';st.textContent='Ouvindo…'};
    rec.onerror=e=>{st.textContent=e.error==='not-allowed'?'Libere o microfone no navegador.':'Não entendi. Tente de novo.'};
    rec.onend=()=>{on=false;b.textContent='Falar a OS'};
    rec.onresult=e=>{
      let t=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();
      if(!t)return;
      t=t.charAt(0).toUpperCase()+t.slice(1);
      const low=t.toLowerCase();
      const hit=known.filter(n=>low.startsWith(n.toLowerCase())).sort((a,c)=>c.length-a.length)[0];
      let c='',d=t;
      if(hit){c=hit;d=t.slice(hit.length).replace(/^[\s,.:;-]+/,'')}
      else{const m=t.match(/^(.{3,40}?)[,.:;]\s+(.*)$/);if(m){c=m[1];d=m[2]}}
      if(c&&!cli.value)cli.value=c;
      d=d.charAt(0).toUpperCase()+d.slice(1);
      desc.value=(desc.value?desc.value+' ':'')+d;
      st.textContent='Confira o texto antes de criar.';
    };
    try{rec.start()}catch(e){}
  };
  return h('div',{class:'acts'},b,st);
}

    }catch(e){er.textContent=(e&&e.code==='permission-denied')?'Sem permissão: cole as novas regras do Firestore (arquivo firestore.rules) no Firebase.':emsg(e)}
  };
  host.append(h('div',{class:'overlay',onclick:e=>{if(e.target.classList.contains('overlay'))close()}},
    h('div',{class:'sheet',role:'dialog','aria-modal':'true'},h('h2',{text:n?'Editar condomínio':'Novo condomínio'}),
      fNome.node,
      h('div',{class:'fld'},h('span',{text:'CNPJ (opcional)'}),h('div',{class:'acts'},fCnpj.el,h('button',{class:'btn small',type:'button',text:'Buscar CNPJ',onclick:buscaCnpj}))),
      h('div',{class:'fld'},h('span',{text:'CEP'}),h('div',{class:'acts'},fCep.el,h('button',{class:'btn small',type:'button',text:'Buscar CEP',onclick:buscaCep}))),
      fLog.node,h('div',{class:'two'},fNum.node,fCom.node),fBai.node,h('div',{class:'two'},fCid.node,fUf.node),
      h('div',{class:'two'},fWa.node,fMail.node),msg,er,
      h('div',{class:'foot'},h('button',{class:'btn',type:'button',text:'Cancelar',onclick:close}),h('button',{class:'btn primary',type:'button',text:'Salvar',onclick:save})))));
  fNome.el.focus();
}
function openCondos(){
  const sheet=$('#sheet');sheet.textContent='';
  const close=()=>{sheet.textContent=''};
  const q=h('input',{type:'text',placeholder:'Buscar condomínio',oninput:()=>draw()});
  const box=h('div');
  function names(){return [...new Set([...orders,...mensais].map(x=>x.cliente).concat(condos.map(c=>c.nome)).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
  function draw(){
    const f=q.value.trim().toLowerCase();box.textContent='';
    const all=[...orders,...mensais];
    for(const n of names().filter(x=>!f||x.toLowerCase().includes(f))){
      const c=cdoc(n)||{};const cnt=all.filter(x=>x.cliente===n).length;
      const sub=[c.cnpj&&fmtCnpj(c.cnpj),c.whats,c.email].filter(Boolean).join(' · ');
      box.append(h('div',{class:'acts',style:'padding:6px 0;border-bottom:1px solid var(--line)'},
        h('div',{style:'flex:1'},h('div',{text:n+' ('+cnt+')'}),sub?h('div',{class:'meta',text:sub}):null,condoLine(c)?h('div',{class:'meta',text:condoLine(c)}):null),
        h('button',{class:'btn small',type:'button',text:'Editar',onclick:()=>openCondoEdit(n,()=>openCondos())})));
    }
    if(!box.children.length)box.append(h('div',{class:'meta',text:'Nenhum condomínio encontrado.'}));
  }
  sheet.append(h('div',{class:'overlay',onclick:e=>{if(e.target.classList.contains('overlay'))close()}},
    h('div',{class:'sheet',role:'dialog','aria-modal':'true'},h('h2',{text:'Condomínios'}),q,box,
      h('div',{class:'foot'},h('button',{class:'btn',type:'button',text:'Fechar',onclick:close}),h('button',{class:'btn primary',type:'button',text:'Novo condomínio',onclick:()=>openCondoEdit('',()=>openCondos())})))));
  draw();
}
async function openAcessos(){
  const sheet=$('#sheet');sheet.textContent='';
  let list=[];try{list=(await getDocs(collection(fs,'usuarios'))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){}
  const em=h('input',{type:'email',placeholder:'e-mail do usuário',inputmode:'email'});
  const boxes=Object.keys(EMPRESAS).filter(k=>EMPRESAS[k].ativa).map(k=>({k,c:h('input',{type:'checkbox',style:'width:auto;min-height:0'})}));
  const er=h('div',{class:'err',role:'alert'});const close=()=>{sheet.textContent=''};
  const save=async()=>{
    const id=em.value.trim().toLowerCase();if(!id.includes('@')){er.textContent='Informe o e-mail.';return}
    try{await setDoc(doc(fs,'usuarios',id),{empresas:boxes.filter(b=>b.c.checked).map(b=>b.k)});toast('Acesso salvo');openAcessos()}catch(e){er.textContent=emsg(e)}};
  sheet.append(h('div',{class:'overlay',onclick:e=>{if(e.target.classList.contains('overlay'))close()}},
    h('div',{class:'sheet',role:'dialog','aria-modal':'true'},h('h2',{text:'Acessos por empresa'}),
      h('div',{class:'meta',text:'Primeiro crie o usuário (e-mail e senha) no Firebase, em Authentication. Aqui você libera as empresas dele. Você (administrador) vê todas.'}),
      list.length?list.map(x=>h('div',{class:'acts'},h('span',{text:x.id+' · '+(x.empresas||[]).map(k=>(EMPRESAS[k]||{}).nome||k).join(', '),style:'flex:1'}),
        h('button',{class:'btn small',text:'Remover',onclick:async()=>{try{await deleteDoc(doc(fs,'usuarios',x.id));openAcessos()}catch(e){er.textContent=emsg(e)}}}))):h('div',{class:'meta',text:'Nenhum usuário liberado ainda.'}),
      h('label',{class:'fld'},h('span',{text:'E-mail'}),em),
      h('div',{class:'acts'},boxes.map(b=>h('label',{class:'acts',style:'gap:4px'},b.c,EMPRESAS[b.k].nome))),er,
      h('div',{class:'foot'},h('button',{class:'btn',type:'button',text:'Fechar',onclick:close}),h('button',{class:'btn primary',type:'button',text:'Salvar acesso',onclick:save})))));
  em.focus();
}

boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
